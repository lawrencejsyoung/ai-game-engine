[workspace]
resolver = "2"
members = ["crates/combat-ai", "crates/combat-ai-ffi", "crates/arena-demo"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"
repository = "https://github.com/lawrencejsyoung/ai-game-engine"

[profile.release]
codegen-units = 1
lto = "thin"

[profile.bench]
codegen-units = 1
lto = "thin"
